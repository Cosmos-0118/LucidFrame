name: Release

# Push a tag like v2.0.0 and installers for Windows, macOS and Linux appear on the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the installers to the existing GitHub release with this tag (e.g. v2.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The macOS build is a bonus: if it fails it must not block the Windows and Linux installers.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Builds are unsigned. (To sign later, add CSC_LINK / CSC_KEY_PASSWORD as env here. Do not pass them while the
      # secrets are unset: an empty CSC_LINK is treated as a file path and breaks the build.)
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: installers/*
          generate_release_notes: true
