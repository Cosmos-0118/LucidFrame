name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Skips optional CUDA provider downloads that CI can't use.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS are switched off for now. To bring them back, add ubuntu-latest and/or macos-latest here
        # (Linux also needs `xvfb-run -a` in front of `npm run test:e2e`).
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Models are release assets, not git files: cache them by manifest hash so most runs download nothing.
      - uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('models/manifest.json') }}
      - run: npm run models
      - name: Known vulnerabilities (runtime dependencies)
        run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - name: Unit and engine tests
        run: npm test
      - name: Self-check (picks the best device this runner has, falls back to CPU)
        run: npm run doctor
      - name: Desktop app end-to-end
        run: npm run test:e2e
      - name: Package and smoke-test the installed app
        run: |
          npm run pack
          npm run smoke:packaged
